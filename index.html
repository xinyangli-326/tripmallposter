<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TripMALL 商品海报生成器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f4f4f4;margin:0}
.wrap{max-width:1320px;margin:20px auto;display:flex;gap:20px;padding:20px}
.left{flex:0 0 400px;background:#fff;border-radius:10px;padding:20px}
.right{flex:1;background:#fff;border-radius:10px;padding:20px;overflow:auto}
h1{font-size:19px;margin:0 0 6px}
.hint{font-size:12px;color:#888;line-height:1.5}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12px}
textarea{height:240px;font-family:monospace;font-size:11px}
button{background:#e08a00;color:#fff;border:0;padding:9px 16px;border-radius:6px;font-size:14px;cursor:pointer;margin:10px 6px 0 0}
button.gr{background:#5a8}
.mode{display:flex;gap:8px;margin:8px 0}.mode button{background:#eee;color:#333;margin:0}.mode button.on{background:#e08a00;color:#fff}
.mcard{width:740px;background:#fff;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mheadimg{width:100%;display:block}
.mtrust{display:flex;justify-content:center;gap:28px;background:#fff7ef;padding:8px 0;font-size:14px;color:#e08a00}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 28px}
.mprod{border:1px solid #f0f0f0;border-radius:6px;overflow:hidden}
.mimg{height:250px;background:#f6f6f6;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:contain}
.mpid{font-size:12px;color:#999;margin:9px 13px 0}.mname{font-size:18px;font-weight:800;color:#222;margin:3px 13px 7px}
.mprice{font-size:15px;color:#e4393c;margin:0 13px}.mprice b{font-size:25px;font-weight:800}.mprice .del{font-size:14px;color:#bbb;text-decoration:line-through;margin-left:7px}
.mtags{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px 15px}.mtags span{border:1px solid #f0b46b;color:#c07d00;border-radius:3px;padding:2px 9px;font-size:12px}
.mfoot{background:#fafaf8;padding:14px 28px;display:flex;justify-content:space-between;align-items:flex-start;border-top:1px solid #eee}
.mfoot .f1{font-weight:800;color:#e08a00;font-size:16px}.mfoot .f2{font-size:12px;color:#444;margin:5px 0}.mfoot .f3{font-size:12px;color:#888}
.mfoot .qr{width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mfoot .qr img{width:86px;height:86px;display:block}.mfoot .qr .cap{font-size:10px;color:#aaa;margin-top:2px}
.msingle .mimg{height:440px}.msingle .mpid{font-size:14px}.msingle .mname{font-size:32px}.msingle .mprice b{font-size:42px}.msingle .mtags span{font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="left"><h1>TripMALL 商品海报生成器</h1>
<p class="hint" id="hint">每行一个商品ID（空格/换行分隔）。从后台商品库取名称/价格/主图/多标签，按原版式出图（含信任栏、底部购买路径导航、二维码）。</p>
<textarea id="ids">6517
69047
67461
67327</textarea>
<label>页脚第二行（优惠话术）</label><input id="foot1" value="新客20元无门槛优惠券 叠加海量店铺优惠券">
<label>页脚第三行（购买路径）</label><input id="foot2" value="电脑端：携程EBooking->商机中心->服务市场；APP端：携程EBooking->用品采购">
<div class="mode"><button class="on" id="mb-grid" onclick="setMode('grid')">4商品拼版</button><button id="mb-single" onclick="setMode('single')">单商品竖版</button></div>
<button onclick="gen()">生成</button><button class="gr" onclick="exportPng()">导出 PNG</button>
</div>
<div class="right"><div id="preview"></div></div>
</div>
<div id="cardBox" hidden></div>
<script>
let mode='grid', DATA={};
async function loadData(){ try{ DATA = await fetch('data/products.json').then(r=>r.json()); }catch(e){ DATA={}; } document.getElementById('hint').innerText = '已加载商品 ' + Object.keys(DATA).length + ' 个。每行填一个商品ID。'; }
function setMode(m){mode=m;document.getElementById('mb-grid').classList.toggle('on',m==='grid');document.getElementById('mb-single').classList.toggle('on',m==='single');gen();}
function imgHTML(p){
  if(!p.image) return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px">【 商品图 '+p.id+' 暂无 】</div>';
  return '<img src="'+p.image+'" crossorigin="anonymous" onerror="this.parentNode.textContent=\'【 商品图 '+p.id+' 加载失败 】\';this.parentNode.style.cssText=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px\'">';
}
async function gen(){
  const ids=document.getElementById('ids').value.trim().split(/\s+/).filter(Boolean);
  if(!ids.length) return;
  const items=ids.map(id=>{ const r=DATA[String(id)]||{}; return {id, name:r.name||('商品'+id), price:r.price||'', unit:r.unit||'', tags:(Array.isArray(r.tags)&&r.tags.length?r.tags:[]), image:r.image||'', type:r.type||'', supplier:r.supplier||'', sales:Number(r.sales)||0}; });
  const box=document.getElementById('cardBox'); box.innerHTML=card(items);
  const pv=document.getElementById('preview'); pv.innerHTML=''; if(box.firstElementChild) pv.appendChild(box.firstElementChild.cloneNode(true));
}
function inferUnit(p){
  const n=p.name||'';
  const slash=n.match(/\/\s*(箱|瓶|套|包|袋|盒|卷|张|桶|罐|支|个|条|床|台|只|双|提|组|片|本|杯|枚|把|块|米)/i);
  if(slash) return slash[1];
  const rules=[
    [/床垫|床褥/,'张'],[/洗发|沐浴|洗手液|护发|润肤|消毒液|矿泉水|饮用水|饮料|香水/,'瓶'],
    [/面巾|毛巾|浴巾|牙具套装|洗漱套装|套装/,'套'],[/茶包|袋泡茶|纸巾包|小包/,'包'],
    [/卷纸|小卷纸|大盘纸|保鲜膜/,'卷'],[/垃圾袋|洗衣袋|购物袋/,'袋'],[/牙刷|梳子|剃须刀|圆珠笔/,'支'],
    [/拖鞋|手套|袜/,'双'],[/枕芯|枕头|被芯|被子|床单|被套|浴袍/,'条'],[/纸杯|咖啡杯|茶杯/,'个'],
    [/抽纸|湿巾|香皂|肥皂/,'盒'],[/桶装|清洁剂/,'桶']
  ];
  for(const [rule,unit] of rules) if(rule.test(n)) return unit;
  return p.unit&&p.unit!=='件'?p.unit:'件';
}
const DETAIL_SELLING_POINTS={
  '4212':['集采低价','防滑舒适','经济适用'],
  '3298':['限时优惠','握感舒适','刷毛软硬适中'],
  '4773':['限时特惠','经典口味','独立包装'],
  '61965':['限时特惠','全棉触感','支持定制'],
  '6831':['集采低价','湿水不破','柔软亲肤'],
  '7445':['限时优惠','独立包装','柔软亲肤'],
  '68115':['限时特惠','国民品牌','品质好水'],
  '67573':['新客立减20元','AI机器人智能清洁','专业水质检测管理'],
  '6517':['多买更优惠','亲肤针织面料','软硬适中'],
  '6651':['采购优惠价','独立袋装弹簧','偏硬护脊承托'],
  '69047':['大货采购优惠','护脊弹簧承托','硬感稳固支撑'],
  '69049':['1元样板体验','护脊弹簧承托','硬感稳固支撑']
};
function uniqueTags(tags){
  const seen=new Set();
  return tags.filter(tag=>{const key=String(tag).replace(/[\s·、，,。/]/g,'');if(!key||seen.has(key))return false;seen.add(key);return true;});
}
function smartTags(p){
  const detailTags=DETAIL_SELLING_POINTS[String(p.id)];
  if(detailTags) return uniqueTags(detailTags).slice(0,3);
  const n=p.name||'', features=[], benefits=[];
  const add=(list,t)=>{ if(t&&!features.includes(t)&&!benefits.includes(t)&&list.length<3) list.push(t); };
  const featureRules=[
    [/防滑/,'轻盈防滑'],[/儿童/,'儿童专用'],[/一次性/,'一次性洁净'],[/铝膜/,'双面铝膜'],[/洗漱套装|牙具.*梳子|梳子.*牙具/,'洗漱配套'],
    [/白茶/,'经典白茶'],[/香氛|香味|香型/,'清雅留香'],[/30克|30g/i,'30g便携装'],[/小瓶/,'便携小瓶'],[/洗发.*沐浴|沐浴.*洗发/,'洗护二合一'],
    [/4层|四层/,'四层加厚'],[/40克|40g/i,'40g足量'],[/印花/,'精美印花'],[/有芯/,'有芯易用'],[/空芯/,'空芯卷纸'],
    [/纯棉|全棉/,'亲肤纯棉'],[/木棉/,'木棉材质'],[/竹浆|原生木浆/,'原生好材质'],[/加厚|厚款/,'加厚耐用'],[/环保|可降解/,'环保材质'],
    [/天然水|矿泉水/,'天然水质'],[/550ml/i,'550ml常用装'],[/500ml/i,'500ml常用装'],[/24瓶/,'24瓶整箱装'],[/整箱/,'整箱采购'],
    [/独立袋装弹簧/,'独立袋装弹簧'],[/偏硬|硬款|硬床垫/,'偏硬稳固支撑'],[/乳胶/,'乳胶舒适层'],[/椰棕|棕垫/,'天然椰棕层'],[/记忆棉/,'释压记忆棉'],
    [/床垫.*25cm|25cm.*床垫/i,'25cm舒适厚度'],[/床垫/,'舒适承托'],[/柔软|亲肤/,'柔软亲肤'],[/吸水/,'快速吸水'],[/耐磨/,'耐磨耐用'],
    [/酒店专用|酒店版/,'酒店专用'],[/民宿/,'民宿适用'],[/大号|加大|超大/,'加大尺寸'],[/独立包装/,'独立包装'],[/无纺布/,'无纺布材质'],
    [/立顿|农夫山泉|今麦郎|金可儿|穗宝/,'经典品牌'],[/高端|精选|精品/,'品质精选']
  ];
  featureRules.forEach(([r,t])=>{if(r.test(n)) add(features,t)});
  const benefitRules=[
    [/全国包邮|包邮/,'全国包邮'],[/新品上线|新品/,'新品尝鲜'],[/满\d+减\d+|满减/,'满减优惠'],[/买\d+赠\d+|买赠/,'买赠活动'],
    [/秒杀/,'限时秒杀'],[/直降|特价|促销/,'限时特惠'],[/优惠券|领券/,'领券立减']
  ];
  benefitRules.forEach(([r,t])=>{if(r.test(n)) add(benefits,t)});
  if(!benefits.length){
    if(/拖鞋/.test(n)) add(benefits,'高颜值新款');
    else if(/铝膜/.test(n)) add(benefits,'密封防潮');
    else if(/洗发|沐浴|洗护/.test(n)) add(benefits,'泡沫绵密');
    else if(/卷纸|纸巾/.test(n)&&Number(p.price)<1) add(benefits,'超值低价');
    else if(/24瓶|整箱/.test(n)) add(benefits,'整箱更划算');
    else if(p.sales>=100000) add(benefits,'爆款热销');
    else if(p.sales>=10000) add(benefits,'酒店热卖');
    else if(/茶包|袋泡茶/.test(n)) add(benefits,'经典味道');
    else if(Number(p.price)>0&&Number(p.price)<1) add(benefits,'经济实惠');
    else if(p.sales>=1000) add(benefits,'采购优选');
    else add(benefits,'品质保证');
  }
  const result=[];
  const addResult=t=>{if(t&&!result.includes(t)&&result.length<3) result.push(t);};
  addResult(benefits[0]);
  features.slice(0,2).forEach(addResult);
  if(result.length<3){
    if(/拖鞋/.test(n)) addResult('防滑舒适');
    else if(/面巾|毛巾|浴巾/.test(n)) addResult('柔软亲肤');
    else if(/牙刷/.test(n)) addResult('刷毛软硬适中');
    else if(/茶包|袋泡茶/.test(n)) addResult('经典口味');
    else if(/纸巾|卷纸/.test(n)) addResult('湿水不破');
    else if(/洗发|沐浴/.test(n)) addResult('泡沫细腻');
    else if(/水|饮料/.test(n)) addResult('品质好水');
    else addResult(p.type==='客房用品'?'经济适用':'品质实用');
  }
  for(const fallback of ['柔软亲肤','支持定制','品质精选']) addResult(fallback);
  return uniqueTags(result).slice(0,3);
}
function card(items){
  const f1=document.getElementById('foot1').value,f2=document.getElementById('foot2').value;
  const ps=mode==='grid'?items.slice(0,4):items.slice(0,1); const sty=mode==='single'?'grid-template-columns:1fr':'';
  const prods=ps.map(p=>'<div class="mprod"><div class="mimg">'+imgHTML(p)+'</div><div class="mpid">'+(mode==='single'?'商品ID: ':'ID: ')+p.id+'</div><div class="mname">'+p.name+'</div><div class="mprice">¥<b>'+p.price+'</b> 元/'+inferUnit(p)+'</div><div class="mtags">'+smartTags(p).map(t=>'<span>'+t+'</span>').join('')+'</div></div>').join('');
  return '<div class="mcard '+(mode==='single'?'msingle':'')+'"><img class="mheadimg" src="logo.png" alt="TripMALL"><div class="mtrust"><span>集采低价</span><span>房券换物</span><span>7天无理由退款</span><span>品质保证</span><span>免费开票</span></div><div class="mgrid" style="'+sty+'">'+prods+'</div><div class="mfoot"><div><div class="f1">TRIPMALL 服务市场</div><div class="f2">'+f1+'</div><div class="f3">'+f2+'</div></div><div class="qr"><img src="qr.png" alt="QR"><div class="cap">扫码领券立减</div></div></div></div>';
}
async function waitForImages(el){
  await Promise.all([...el.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;})));
}
async function exportPng(){
  let el=document.querySelector('#preview .mcard');
  if(!el){ await gen(); el=document.querySelector('#preview .mcard'); }
  if(!el) return;
  await waitForImages(el);
  const c=await html2canvas(el,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#fff'});
  c.toBlob(blob=>{
    if(!blob) return alert('海报生成失败，请刷新页面后重试');
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='product-card.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
}
loadData();
</script>
</body>
</html>
