<body>

67461

<script>
let mode='grid', DATA={};
async function loadData(){ try{ DATA = await fetch('data/products.json').then(r=>r.json()); }catch(e){ DATA={}; } document.getElementById('hint').innerText = '已加载商品 ' + Object.keys(DATA).length + ' 个。每行填一个商品ID。'; }
function setMode(m){mode=m;document.getElementById('mb-grid').classList.toggle('on',m==='grid');document.getElementById('mb-single').classList.toggle('on',m==='single');gen();}
function imgHTML(p){
  if(!p.image) return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px">【 商品图 '+p.id+' 暂无 】</div>';
  return '<img src="'+p.image+'" crossorigin="anonymous" onerror="this.parentNode.textContent=\'【 商品图 '+p.id+' 加载失败 】\';this.parentNode.style.cssText=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px\'">';
}
async function gen(){
  const ids=document.getElementById('ids').value.trim().split(/\s+/).filter(Boolean);
  if(!ids.length) return;
  const items=ids.map(id=>{ const r=DATA[String(id)]||{}; return {id, name:r.name||('商品'+id), price:r.price||'', unit:r.unit||'', tags:(Array.isArray(r.tags)&&r.tags.length?r.tags:[]), image:r.image||'', type:r.type||'', supplier:r.supplier||'', sales:Number(r.sales)||0}; });
  const box=document.getElementById('cardBox'); box.innerHTML=card(items);
  const pv=document.getElementById('preview'); pv.innerHTML=''; if(box.firstElementChild) pv.appendChild(box.firstElementChild.cloneNode(true));
}
function inferUnit(p){
  const n=p.name||'';
  const slash=n.match(/\/\s*(箱|瓶|套|包|袋|盒|卷|张|桶|罐|支|个|条|床|台|只|双|提|组|片|本|杯|枚|把|块|米)/i);
  if(slash) return slash[1];
  const rules=[
    [/床垫|床褥/,'张'],[/洗发|沐浴|洗手液|护发|润肤|消毒液|矿泉水|饮用水|饮料|香水/,'瓶'],
    [/面巾|毛巾|浴巾|牙具套装|洗漱套装|套装/,'套'],[/茶包|袋泡茶|纸巾包|小包/,'包'],
    [/卷纸|小卷纸|大盘纸|保鲜膜/,'卷'],[/垃圾袋|洗衣袋|购物袋/,'袋'],[/牙刷|梳子|剃须刀|圆珠笔/,'支'],
    [/拖鞋|手套|袜/,'双'],[/枕芯|枕头|被芯|被子|床单|被套|浴袍/,'条'],[/纸杯|咖啡杯|茶杯/,'个'],
    [/抽纸|湿巾|香皂|肥皂/,'盒'],[/桶装|清洁剂/,'桶']
  ];
  for(const [rule,unit] of rules) if(rule.test(n)) return unit;
  return p.unit&&p.unit!=='件'?p.unit:'件';
}
const DETAIL_SELLING_POINTS={
  '4212':['集采低价','防滑舒适','经济适用'],
  '3298':['限时优惠','握感舒适','刷毛软硬适中'],
  '4773':['限时特惠','经典口味','独立包装'],
  '61965':['限时特惠','全棉触感','支持定制'],
  '6831':['集采低价','湿水不破','柔软亲肤'],
  '7445':['限时优惠','独立包装','柔软亲肤'],
  '68115':['限时特惠','国民品牌','品质好水'],
  '67573':['新客立减20元','AI机器人智能清洁','专业水质检测管理'],
  '6517':['多买更优惠','亲肤针织面料','软硬适中'],
  '6651':['采购优惠价','独立袋装弹簧','偏硬护脊承托'],
  '69047':['大货采购优惠','护脊弹簧承托','硬感稳固支撑'],
  '69049':['1元样板体验','护脊弹簧承托','硬感稳固支撑']
};
function uniqueTags(tags){
  const seen=new Set();
  return tags.filter(tag=>{const key=String(tag).replace(/[\s·、，,。/]/g,'');if(!key||seen.has(key))return false;seen.add(key);return true;});
}
function smartTags(p){
  const detailTags=DETAIL_SELLING_POINTS[String(p.id)];
  if(detailTags) return uniqueTags(detailTags).slice(0,3);
  const n=p.name||'', price=Number(p.price)||0, sales=Number(p.sales)||0;
  const picked=[];
  const add=t=>{if(t&&!picked.includes(t)&&picked.length<3)picked.push(t);};

  if(/样品|试样|专拍|试用/.test(n)) add('试样特惠');
  else if(/全国包邮|包邮/.test(n)) add('全国包邮');
  else if(/满\d+(?:\.\d+)?减\d+|满减/.test(n)) add('满减优惠');
  else if(/秒杀/.test(n)) add('限时秒杀');
  else if(/特价|促销|直降|限时/.test(n)) add('限时特惠');
  else if(/批发|厂家直销|工厂直销/.test(n)) add('集采低价');
  else if(price>0&&price<=0.3) add('集采低价');
  else if(price>0&&price<=1) add('经济实惠');
  else if(sales>=100000) add('爆款热销');
  else if(sales>=10000) add('酒店热卖');
  else if(sales>=1000) add('采购优选');
  else {
    const options=/服务|拍摄|设计|托管|推广|运营|培训|检测/.test(n)?['服务优惠','专业服务价','省心托管价']:['集采优选','采购优惠','高性价比'];
    const seed=String(p.id||n).split('').reduce((sum,ch)=>sum+ch.charCodeAt(0),0);
    add(options[seed%options.length]);
  }

  const rules=[
    [/珊瑚绒/,'柔软珊瑚绒'],[/拉毛绒|拉毛布/,'舒适拉毛绒'],[/棉柔布/,'亲肤棉柔布'],[/真美布/,'细腻真美布'],[/亚麻布|亚麻/,'透气亚麻面'],[/棉麻布|棉麻/,'透气棉麻面'],[/无纺布/,'轻便无纺布'],[/帆布/,'耐穿帆布面'],[/华夫格/,'立体华夫格'],[/仿棉/,'柔软仿棉面'],
    [/柳叶纹/,'柳叶纹防滑'],[/XPE/i,'XPE防滑底'],[/EVA/i,'轻盈EVA鞋底'],[/镶底|穿条工艺/,'加固镶底工艺'],[/厚底|加厚鞋底|加厚底/,'加厚鞋底'],[/减震/,'减震缓冲'],[/静音/,'静音运行'],[/镂空|漏水/,'镂空速干'],[/可水洗|返洗/,'可水洗复用'],[/无异味|无味/,'清新无异味'],[/可降解/,'环保可降解'],
    [/5mm\s*[\/、-]\s*6mm|5毫米\s*[\/、-]\s*6毫米/i,'5/6mm多规格'],[/7mm|7毫米/i,'7mm厚底'],[/6mm|6毫米/i,'6mm厚底'],[/5mm|5毫米/i,'5mm舒适底'],[/4mm|4毫米/i,'4mm轻便底'],[/加大|大码|44码/,'加大舒适版'],[/儿童|童款/,'儿童专用'],[/亲子/,'亲子房适用'],[/卡通|印花/,'趣味印花款'],[/防滑/,'防滑舒适'],
    [/竹炭毛|竹炭/,'竹炭软毛'],[/秸秆|麦秸/,'环保秸秆柄'],[/软毛/,'柔韧软毛'],[/细毛|超细毛/,'细密刷毛'],[/磨砂软膜|软膜/,'防水软膜包装'],[/牛皮纸|牛皮盒/,'质感牛皮纸盒'],[/卡盒|纸盒/,'独立卡盒包装'],[/铝膜/,'双面铝膜'],[/烫金/,'精致烫金工艺'],[/牙膏二合一|带牙膏/,'牙膏配套'],
    [/白茶/,'经典白茶'],[/绿茶/,'清新绿茶'],[/香氛|留香|香型/,'清雅留香'],[/锡封口/,'锡封防漏设计'],[/30克|30g/i,'30g便携装'],[/20克|20g/i,'20g轻巧装'],[/小瓶/,'便携小瓶'],[/大瓶/,'大容量瓶装'],[/洗发.*沐浴|沐浴.*洗发/,'洗护配套'],[/泡沫丰富|泡沫绵密|泡沫细腻/,'泡沫绵密'],
    [/湿水不破/,'湿水不易破'],[/易溶易冲/,'易溶易冲'],[/不掉纸屑|不掉屑/,'洁净不掉屑'],[/无香型|无香/,'清新无香'],[/竹浆|原生木浆/,'原生好材质'],[/本色纸|本色/,'天然本色纸'],[/4层|四层/,'四层加厚'],[/3层|三层/,'三层柔韧'],[/2层|双层/,'双层实用'],[/\d+抽/,'足量多抽'],[/有芯/,'有芯易用'],[/空芯/,'空芯卷纸'],
    [/新疆长绒棉|长绒棉/,'新疆长绒棉'],[/纯棉|全棉/,'全棉亲肤'],[/贡缎/,'细腻贡缎织造'],[/涤棉/,'耐洗涤棉'],[/羽绒|赛羽绒/,'蓬松羽绒感'],[/抗菌|抑菌/,'安心抗菌'],[/吸水|速干/,'吸水速干'],[/加密|高密/,'高密耐用'],[/支持定制|定制/,'支持定制'],
    [/独立袋装弹簧|袋装弹簧/,'独立袋装弹簧'],[/偏硬|硬款|硬床垫/,'偏硬稳固支撑'],[/乳胶/,'乳胶舒适层'],[/椰棕|棕垫/,'天然椰棕层'],[/记忆棉|太空棉/,'释压记忆棉'],[/护脊/,'护脊承托'],[/软硬适中/,'软硬适中'],
    [/高速电机|高速吹风/,'高速电机'],[/负离子/,'负离子护发'],[/恒温/,'恒温呵护'],[/折叠/,'折叠便携'],[/大功率/,'强劲大功率'],[/低噪|降噪|静音/,'低噪运行'],[/节能/,'节能省电'],[/智能|AI/,'智能操控'],[/防水/,'安心防水'],[/轻量|轻盈|便携/,'轻盈便携'],
    [/304不锈钢|304钢/,'304不锈钢'],[/316不锈钢|316钢/,'316不锈钢'],[/陶瓷/,'细腻陶瓷'],[/玻璃/,'通透玻璃材质'],[/密胺/,'耐用密胺材质'],[/双层|双层杯/,'双层隔热'],[/保温|焖烧/,'长效保温'],[/防烫/,'隔热防烫'],[/防漏|密封/,'密封防漏'],[/大容量/,'大容量设计'],[/食品级/,'食品级材质'],
    [/加厚|厚款/,'加厚耐用'],[/纯新料/,'纯新料材质'],[/不易破|结实/,'结实耐用'],[/除菌|杀菌|消毒/,'高效除菌'],[/除油|去油/,'强力去油'],[/除垢/,'快速除垢'],[/除味|去味/,'清新除味'],[/高泡/,'丰富高泡'],[/低泡/,'低泡易漂洗'],[/浓缩/,'浓缩配方'],[/多功能/,'一瓶多用'],
    [/天然水|矿泉水/,'品质好水'],[/550ml/i,'550ml常用装'],[/500ml/i,'500ml常用装'],[/24瓶/,'24瓶整箱装'],[/整箱/,'整箱采购'],
    [/航拍/,'专业航拍'],[/视频拍摄|房型视频/,'专业视频拍摄'],[/图片拍摄|酒店摄影|照片套餐/,'专业空间摄影'],[/剪辑/,'专业视频剪辑'],[/达人|种草|推广|流量/,'营销推广助力'],[/全国拍摄|全国上门/,'全国上门服务'],[/免房置换/,'支持免房置换'],[/定制设计|图文设计|设计服务/,'专属定制设计'],
    [/水质检测/,'专业水质检测'],[/设备巡检|巡检维护/,'设备巡检维护'],[/机器人清洁|智能清洁/,'智能清洁服务'],[/全生命周期/,'全周期运营保障'],[/数字档案|数字化/,'数字化管理'],[/专业团队/,'专业团队服务'],
    [/自动咖啡机|全自动咖啡机/,'全自动咖啡制作'],[/咖啡机/,'便捷咖啡制作'],[/热水壶|电水壶/,'快速烧水'],[/吹风机/,'快速干发'],[/吸尘器/,'强劲吸尘'],[/洗衣机/,'高效洗涤'],[/冰箱|冷柜/,'稳定制冷'],[/空调/,'舒适温控'],[/电视|投影/,'影音娱乐体验'],[/台灯|阅读灯/,'柔和照明'],
    [/伸缩杆/,'长度伸缩可调'],[/告示牌|提示牌|指示牌/,'醒目标识提醒'],[/推水器|刮水器/,'快速清理积水'],[/涂水器/,'均匀涂水清洁'],[/收纳车|收纳箱|收纳盒|贮物桶|储物桶/,'大容量收纳'],[/地毯.*香波|地毯.*清洁/,'地毯深层清洁'],[/百洁布/,'强力去污'],[/拖把|尘推/,'高效地面清洁'],
    [/保护垫/,'床垫防护'],[/枕芯|枕头/,'蓬松承托'],[/被芯|被子/,'温暖蓬松'],[/床单|被套|枕套|四件套/,'舒适床品'],[/浴巾|毛巾|面巾|方巾|地巾/,'柔软亲肤'],[/螺旋/,'蓬松螺旋织造'],[/高克重|\d+g/,'厚实高克重'],
    [/主题房|功能房/,'主题氛围营造'],[/摆台|装饰|挂画|墙贴|贴纸/,'空间装饰点睛'],[/玩具|积木|公仔|玩偶/,'趣味互动体验'],[/宠物/,'宠物友好配套'],[/康养|按摩|理疗/,'舒适康养体验'],
    [/汤勺|漏勺|餐勺|勺子/,'顺手实用'],[/餐盘|盘子|托盘/,'稳固盛放'],[/餐碗|碗具/,'日常耐用'],[/筷子/,'握持顺手'],[/菜刀|刀具/,'锋利易切'],[/锅具|炒锅|汤锅/,'均匀受热'],[/刮刀|锅铲/,'灵活易用'],[/杯盖|带盖/,'防尘杯盖']
  ];
  for(const [rule,label] of rules){if(rule.test(n))add(label);if(picked.length>=3)break;}

  if(picked.length<3){
    const fallbacks=[];
    if(/拖鞋/.test(n)) fallbacks.push('酒店客房适用','轻盈舒适');
    else if(/牙刷|牙具|梳子/.test(n)) fallbacks.push('握感舒适','酒店洗漱适用');
    else if(/洗发|沐浴|洗护/.test(n)) fallbacks.push('温和清洁','酒店洗护适用');
    else if(/纸|巾/.test(n)) fallbacks.push('柔韧亲肤','酒店高频适用');
    else if(/床单|被套|枕|床垫|被芯|保护垫/.test(n)) fallbacks.push('舒适睡眠体验','酒店布草适用');
    else if(/吹风机|热水壶|电视|冰箱|空调|灯|电机|吸尘|洗衣机|咖啡机/.test(n)) fallbacks.push('操作便捷','酒店商用适配');
    else if(/垃圾袋|清洁|清洗|消毒|洗涤|除菌|百洁布|拖把/.test(n)) fallbacks.push('高效清洁','商用保洁适用');
    else if(/杯|碗|盘|勺|筷|锅|刀|餐具/.test(n)) fallbacks.push('日常耐用','酒店餐厨适用');
    else if(/服务|拍摄|设计|托管|推广|运营|培训|检测/.test(n)) fallbacks.push('专业团队服务','酒店运营适用');
    else if(/水|饮料|茶|咖啡/.test(n)) fallbacks.push('酒店常备','便捷采购');
    else if(/杆|架|车|箱|盒|桶|柜/.test(n)) fallbacks.push('结构实用','收纳管理便捷');
    else if(/牌|标识|标牌/.test(n)) fallbacks.push('醒目易识别','酒店场景适用');
    else if(/主题|摆件|装饰|玩具/.test(n)) fallbacks.push('主题氛围营造','提升宾客体验');
    else fallbacks.push('酒店场景适用','采购省心');
    fallbacks.forEach(add);
  }
  return uniqueTags(picked).slice(0,3);
}
function card(items){
  const f1=document.getElementById('foot1').value,f2=document.getElementById('foot2').value;
  const ps=mode==='grid'?items.slice(0,4):items.slice(0,1); const sty=mode==='single'?'grid-template-columns:1fr':'';
  const prods=ps.map(p=>'<div class="mprod"><div class="mimg">'+imgHTML(p)+'</div><div class="mpid">'+(mode==='single'?'商品ID: ':'ID: ')+p.id+'</div><div class="mname">'+p.name+'</div><div class="mprice">¥<b>'+p.price+'</b> 元/'+inferUnit(p)+'</div><div class="mtags">'+smartTags(p).map(t=>'<span>'+t+'</span>').join('')+'</div></div>').join('');
  return '<div class="mcard '+(mode==='single'?'msingle':'')+'"><img class="mheadimg" src="logo.png" alt="TripMALL"><div class="mtrust"><span>集采低价</span><span>房券换物</span><span>7天无理由退款</span><span>品质保证</span><span>免费开票</span></div><div class="mgrid" style="'+sty+'">'+prods+'</div><div class="mfoot"><div><div class="f1">TRIPMALL 服务市场</div><div class="f2">'+f1+'</div><div class="f3">'+f2+'</div></div><div class="qr"><img src="qr.png" alt="QR"><div class="cap">扫码领券立减</div></div></div></div>';
}
async function waitForImages(el){
  await Promise.all([...el.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;})));
}
async function exportPng(){
  let el=document.querySelector('#preview .mcard');
  if(!el){ await gen(); el=document.querySelector('#preview .mcard'); }
  if(!el) return;
  await waitForImages(el);
  const c=await html2canvas(el,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#fff'});
  c.toBlob(blob=>{
    if(!blob) return alert('海报生成失败，请刷新页面后重试');
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='product-card.png';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
}
