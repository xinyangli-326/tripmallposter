<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TripMALL 商品海报生成器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f4f4f4;margin:0}
.wrap{max-width:1320px;margin:20px auto;display:flex;gap:20px;padding:20px}
.left{flex:0 0 400px;background:#fff;border-radius:10px;padding:20px}
.right{flex:1;background:#fff;border-radius:10px;padding:20px;overflow:auto}
h1{font-size:19px;margin:0 0 6px}
.hint{font-size:12px;color:#888;line-height:1.5}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12px}
textarea{height:200px;font-family:monospace;font-size:11px}
button{background:#e08a00;color:#fff;border:0;padding:9px 16px;border-radius:6px;font-size:14px;cursor:pointer;margin:10px 6px 0 0}
button.gr{background:#5a8}
.mode{display:flex;gap:8px;margin:8px 0}.mode button{background:#eee;color:#333;margin:0}.mode button.on{background:#e08a00;color:#fff}
.edit-row{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.edit-row .eid{font-weight:700;font-size:12px;color:#666;min-width:50px}
.edit-row input{flex:1;min-width:70px;padding:5px 7px;border:1px solid #ddd;border-radius:5px;font-size:12px}
.edit-row input.en{flex:2.2;min-width:130px}
.edithint{font-size:11px;color:#999;margin:4px 0 2px}
.hist-row{display:flex;gap:6px;align-items:center;font-size:12px;margin:4px 0;flex-wrap:wrap;border-bottom:1px dashed #eee;padding-bottom:3px}
.hist-row .hf{color:#888;min-width:36px}
.hist-row .hv{color:#c05a00;font-weight:700;flex:1}
.hist-row .ht{color:#aaa;font-size:10px}
.hist-row button{margin:0;padding:2px 8px;font-size:12px;background:#5a8;color:#fff;border:0;border-radius:5px;cursor:pointer}

/* ========== 白底模板 ========== */
.mcard{width:740px;background:#fff;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mheadimg{width:100%;display:block}
.mtrust{display:flex;justify-content:center;gap:28px;background:#fff7ef;padding:8px 0;font-size:14px;color:#e08a00}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 28px}
.mprod{border:1px solid #f0f0f0;border-radius:6px;overflow:hidden}
.mimg{height:250px;background:#f6f6f6;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:contain}
.mpid{font-size:12px;color:#999;margin:9px 13px 0}.mname{font-size:18px;font-weight:800;color:#222;margin:3px 13px 7px}
.mprice{font-size:15px;color:#e4393c;margin:0 13px}.mprice b{font-size:25px;font-weight:800}
.mtags{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px 15px}.mtags span{border:1px solid #f0b46b;color:#c07d00;border-radius:3px;padding:2px 9px;font-size:12px}
.mfoot{background:#fafaf8;padding:14px 28px;display:flex;justify-content:space-between;align-items:flex-start;border-top:1px solid #eee}
.mfoot .f1{font-weight:800;color:#e08a00;font-size:16px}.mfoot .f2{font-size:12px;color:#444;margin:5px 0}.mfoot .f3{font-size:12px;color:#888}
.mfoot .qr{width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mfoot .qr img{width:86px;height:86px;display:block}.mfoot .qr .cap{font-size:10px;color:#aaa;margin-top:2px}
.msingle .mimg{height:440px}.msingle .mpid{font-size:14px}.msingle .mname{font-size:32px}.msingle .mprice b{font-size:42px}.msingle .mtags span{font-size:13px}

/* ========== 红色大促模板（参考图底图 + 4 个动态商品卡） ========== */
.rcard{width:540px;height:960px;margin:0 auto;position:relative;overflow:hidden;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);background:url('red_bg.png') center/100% 100% no-repeat}
.rprod{position:absolute;background:#fff;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.rpimg{flex:1;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:10px;overflow:hidden;padding:2px}
.rpimg img{width:100%;height:100%;object-fit:contain}
.rb-id{font-size:8px;color:#999;margin:5px 10px 0}
.rb-name{font-size:12px;font-weight:800;color:#222;margin:1px 10px 4px;line-height:1.25;max-height:30px;overflow:hidden}
.rb-price{color:#e4393c;font-size:9px;margin:0 10px 4px;font-weight:600}
.rb-price b{font-size:19px;font-weight:900}
.rb-tags{display:flex;flex-wrap:wrap;gap:3px;padding:0 10px 10px}
.rb-tags span{background:#fdecda;color:#b56b00;border:1px solid #f4d19b;border-radius:8px;padding:2px 7px;font-size:9px}
.rprod.big{border-radius:12px}
.rprod.big .rpimg{flex:1}
.rprod.big .rb-id{font-size:13px;color:#999;margin:10px 20px 2px}
.rprod.big .rb-name{font-size:20px;font-weight:800;color:#222;margin:0 20px 7px;line-height:1.3;max-height:56px;overflow:hidden}
.rprod.big .rb-price{font-size:14px;margin:0 20px 9px}
.rprod.big .rb-price b{font-size:33px;font-weight:900}
.rprod.big .rb-tags{padding:0 20px 22px;gap:5px}
.rprod.big .rb-tags span{font-size:14px;padding:3px 12px;border-radius:9px}
.rqr{position:absolute;left:453px;top:882px;width:56px;height:56px;background:#fff;border-radius:6px;padding:3px;box-sizing:border-box;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.rqr img{width:100%;height:100%;object-fit:contain}

/* ========== 金色推荐模板（参考图底图 + 4 个动态商品卡） ========== */
.gcard{width:707px;height:1363px;margin:0 auto;position:relative;overflow:hidden;border-radius:8px;box-shadow:0 3px 16px rgba(0,0,0,.3);background:url('gold_bg.png') center/100% 100% no-repeat}
.gprod{position:absolute;background:#fff;border:1px solid #bfb7ac;border-radius:6px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column}
.gimg{height:264px;flex:0 0 264px;padding:5px 5px 0;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #d5cec4;overflow:hidden}
.gimg img{max-width:100%;max-height:100%;object-fit:contain}
.gbody{flex:1;min-height:0;padding:10px 10px 13px;box-sizing:border-box;display:flex;flex-direction:column}
.gid{font-size:10px;color:#9a9a9a;line-height:1;flex:0 0 auto}
.gname{font-size:15px;font-weight:700;color:#3d3833;margin-top:3px;line-height:1.12;flex:1 1 auto;min-height:0;overflow:hidden}
.gprice{display:flex;align-items:baseline;line-height:1;color:#e4393c;flex:0 0 auto}
.gprice .gy{font-size:22px;font-weight:600;letter-spacing:-1px}
.gprice b{font-size:23px;font-weight:800;letter-spacing:-0.5px}
.gprice .gu{font-size:11.5px;font-weight:600;margin-left:2px}
.gtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;flex:0 0 auto}
.gtags span{background:#fde6d9;color:#ef9143;border-radius:4px;padding:2px 7px;font-size:10.5px;line-height:1.2}
.gpanel{position:absolute;left:561px;top:401px;width:116px;height:149px}
.gpanel img{width:100%;height:100%;display:block}
.gqr{position:absolute;left:580px;top:461px;width:75px;height:75px}
.gqr img{width:100%;height:100%;object-fit:contain;display:block}
.gsingle .gimg{height:auto;flex:1 1 auto;padding:10px 10px 0}
.gsingle .gbody{flex:0 0 auto;padding:20px 22px 22px}
.gsingle .gid{font-size:14px}
.gsingle .gname{font-size:25px;margin-top:8px;line-height:1.18;flex:0 0 auto;max-height:74px}
.gsingle .gprice{margin-top:14px}
.gsingle .gprice .gy{font-size:34px}
.gsingle .gprice b{font-size:44px}
.gsingle .gprice .gu{font-size:20px}
.gsingle .gtags{margin-top:14px;gap:8px}
.gsingle .gtags span{font-size:15px;padding:5px 13px}


/* ========== 表格模式（品名/图片/规格/产品标准/价格，行数不限） ========== */
.tcard{width:1180px;margin:0 auto;background:#fff;padding:16px;box-sizing:border-box;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.ttable{width:100%;border-collapse:collapse;table-layout:fixed;font-family:"Microsoft YaHei",sans-serif}
.ttable th,.ttable td{border:1px solid #000;padding:6px 8px;vertical-align:middle}
.ttable th{font-size:20px;font-weight:800;color:#111;text-align:center;height:54px}
.ttable td{font-size:13px;color:#222}
.tcat{font-size:18px;font-weight:800;text-align:center;line-height:1.35}
.timg{text-align:center;padding:6px}
.timg img{max-width:150px;max-height:120px;object-fit:contain;display:block;margin:0 auto}
.tspec{font-size:14px;font-weight:700;line-height:1.45}
.tstd{font-size:13px;line-height:1.7;text-align:justify}
.tstd i{font-style:normal;margin-right:6px}
.tprice{text-align:center;color:#e4393c;font-weight:800;font-size:19px;white-space:nowrap}
.ttip{font-size:12px;color:#999;text-align:center;padding:6px 0 0}


/* ========== 水印层（斜向「携程服务市场 TripMALL」，可开关） ========== */
.wm{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;z-index:99}
.wm i{position:absolute;font-family:"Microsoft YaHei",sans-serif;font-weight:700;font-size:26px;letter-spacing:2px;color:rgba(60,40,10,.085);white-space:nowrap;transform:rotate(-26deg);transform-origin:left top}
.mcard{position:relative}
.tcard{position:relative}


</style>
</head>
<body>
<div class="wrap">
<div class="left"><h1>TripMALL 商品海报生成器</h1>
<p class="hint" id="hint">每行一个商品ID（空格/换行分隔）。从后台商品库取名称/价格/主图/多标签，按所选模板出图。</p>
<label>海报模板</label>
<div class="mode"><button class="on" id="tb-white" onclick="setTpl('white')">白底模板</button><button id="tb-red" onclick="setTpl('red')">红色大促</button><button id="tb-gold" onclick="setTpl('gold')">金色推荐</button><button id="tb-table" onclick="setTpl('table')">表格模式</button></div>
<label>版式</label>
<div class="mode"><button class="on" id="mb-grid" onclick="setMode('grid')">4商品拼版</button><button id="mb-single" onclick="setMode('single')">单商品竖版</button></div>
<label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer"><input type="checkbox" id="wmOn" style="width:auto;margin:0" onchange="WM=this.checked;gen()"> 添加水印（斜向「携程服务市场 TripMALL」）</label>
<textarea id="ids">6517
69047
67461
67327</textarea>
<label>页脚第二行（优惠话术）</label><input id="foot1" value="新客20元无门槛优惠券 叠加海量店铺优惠券">
<label>页脚第三行（购买路径）</label><input id="foot2" value="电脑端：携程EBooking->商机中心->服务市场；APP端：携程EBooking->用品采购">
<label>商品信息（可编辑价格/单位/标签）</label>
<div class="edithint">标签用逗号分隔，如：经济实惠,客房标配</div>
<div id="editArea"></div>
<button style="margin-top:6px;background:#5a8" onclick="saveSnap()">保存本轮编辑</button><button style="margin-top:6px;margin-left:4px" onclick="renderHistory()">查看保存记录</button>
<div id="histArea"></div>
<button onclick="gen()">生成</button><button class="gr" onclick="exportPng()">导出 PNG</button>
</div>
<div class="right"><div id="preview"></div></div>
</div>
<div id="cardBox" hidden></div>
<script>
let mode='grid', tpl='white', DATA={}, SPECS={}, edits={}, idsKey='', WM=false;
function wmHTML(w,h){
  const text='携程服务市场 TripMALL', stepX=330, stepY=190;
  let out='';
  for(let y=-140;y<h+160;y+=stepY){
    for(let x=-180;x<w+240;x+=stepX){
      out+='<i style="left:'+x+'px;top:'+y+'px">'+text+'</i>';
    }
  }
  return '<div class="wm">'+out+'</div>';
}
try{ edits=JSON.parse(localStorage.getItem('tme_edits')||'{}'); }catch(e){ edits={}; }
function saveEdits(){ try{ localStorage.setItem('tme_edits', JSON.stringify(edits)); }catch(e){} }
function saveSnap(){ try{ const ids=document.getElementById('ids').value.trim().split(/\s+/).filter(Boolean); const snap={t:Date.now(), ids, edits:JSON.parse(JSON.stringify(edits))}; const s=JSON.parse(localStorage.getItem('tme_saved')||'[]'); s.unshift(snap); localStorage.setItem('tme_saved', JSON.stringify(s.slice(0,30))); renderHistory(); alert('已保存本轮编辑'); }catch(e){} }
function renderHistory(){ try{ const s=JSON.parse(localStorage.getItem('tme_saved')||'[]'); const el=document.getElementById('histArea'); if(!el) return; if(!s.length){ el.innerHTML='<div class="edithint">暂无保存记录。点「保存本轮编辑」即可保存。</div>'; return; } el.innerHTML=s.map((x,i)=>'<div class="hist-row"><span class="ht">'+new Date(x.t).toLocaleString()+'</span><span class="hv">'+esc(x.ids.join(','))+'</span><button onclick="applySnap('+i+')">应用</button><button onclick="delSnap('+i+')" style="background:#c00">删除</button></div>').join(''); }catch(e){ const el=document.getElementById('histArea'); if(el) el.innerHTML=''; } }
function applySnap(i){ try{ const s=JSON.parse(localStorage.getItem('tme_saved')||'[]'); const x=s[i]; if(!x) return; edits=JSON.parse(JSON.stringify(x.edits)); saveEdits(); document.getElementById('ids').value=x.ids.join('\n'); idsKey=''; gen(); }catch(e){} }
function delSnap(i){ try{ const s=JSON.parse(localStorage.getItem('tme_saved')||'[]'); s.splice(i,1); localStorage.setItem('tme_saved', JSON.stringify(s)); renderHistory(); }catch(e){} }
async function loadData(){ try{ DATA = await fetch('data/products.json?v=4').then(r=>r.json()); }catch(e){ DATA={}; }
  try{ SPECS = await fetch('data/specs.json?v=1').then(r=>r.json()); }catch(e){ SPECS={}; }
  const n=Object.keys(DATA).length, m=Object.keys(SPECS).length;
  document.getElementById('hint').innerText = '已加载商品 '+n+' 个'+(m?('，规格库 '+m+' 个'):'（规格库未加载）')+'。每行填一个商品ID。'; gen(); }
function setTpl(t){tpl=t;document.getElementById('tb-white').classList.toggle('on',t==='white');document.getElementById('tb-red').classList.toggle('on',t==='red');document.getElementById('tb-gold').classList.toggle('on',t==='gold');document.getElementById('tb-table').classList.toggle('on',t==='table');gen();}
function setMode(m){mode=m;document.getElementById('mb-grid').classList.toggle('on',m==='grid');document.getElementById('mb-single').classList.toggle('on',m==='single');gen();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function guessUnit(name){
  const n=name||'';
  const r=(re)=>re.test(n);
  if(r(/箱|整箱|箱装|件\/箱|瓶\/箱|支\/箱|24瓶|12瓶|24听|12听/)) return '箱';
  if(r(/矿泉水|饮用水|纯净水|山泉水|天然水|苏打水|气泡水/)) return '箱';
  if(r(/洗发|洗手|沐浴|洗沐|洗衣液|洗洁|消毒液|洁厕|护发|护理液|漱口|清洁剂|酒精|精油|洗发水|洗手液|沐浴露/)) return '瓶';
  if(r(/套装|六件套|五件套|四件套|洗漱|牙具|护理包|旅行套装|床品四件/)) return '套';
  if(r(/茶包|袋泡茶|抽纸|卷纸|湿巾|面巾纸|擦手纸|纸巾/)) return '包';
  if(r(/吹风机|电水壶|电视机|冰箱|空调|洗衣机|加湿器|热水器|咖啡机|茶饮机|打印机|投影仪|扫地机|电风扇|电暖器|挂烫机|体重秤|灭蚊器|熨斗/)) return '台';
  if(r(/毛巾|浴巾|方巾|地巾|床单|被套|枕套|夏被|毛毯|浴袍|浴衣/)) return '条';
  if(r(/床垫|保护垫|枕芯|被芯|枕头|拖鞋|咖啡杯|杯/)) return '件';
  return '件';
}
function imgHTML(p){
  if(!p.image) return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px">【 商品图 '+esc(p.id)+' 暂无 】</div>';
  return '<img src="'+p.image+'" crossorigin="anonymous" onerror="this.parentNode.textContent=\'【 商品图 '+esc(p.id)+' 加载失败 】\';this.parentNode.style.cssText=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px\'">';
}
function buildEditors(ids){
  const area=document.getElementById('editArea'); if(!area) return;
  area.innerHTML=ids.map(id=>{
    const r=DATA[String(id)]||{}; const e=edits[id]||{};
    const name=(e.name!=null?e.name:(r.name||('商品'+id))); const price=(e.price!=null?e.price:(r.price||'')); const unit=(e.unit!=null?e.unit:(guessUnit(r.name)||r.unit||'件')); const tags=(e.tags!=null?e.tags:(Array.isArray(r.tags)?r.tags:[])); const cat=(e.cat!=null?e.cat:'');
    return '<div class="edit-row"><span class="eid">'+esc(id)+'</span><input class="en" placeholder="商品名" value="'+esc(name)+'" data-id="'+esc(id)+'" data-f="name"><input class="ep" placeholder="价格" value="'+esc(price)+'" data-id="'+esc(id)+'" data-f="price"><input class="eu" placeholder="单位" value="'+esc(unit)+'" data-id="'+esc(id)+'" data-f="unit"><input class="et" placeholder="标签(逗号分隔)" value="'+esc(tags.join(','))+'" data-id="'+esc(id)+'" data-f="tags"><input class="ec" placeholder="品名(表格用，留空=自动)" value="'+esc(cat)+'" data-id="'+esc(id)+'" data-f="cat"></div>';
  }).join('');
  area.querySelectorAll('input').forEach(inp=>{ inp.addEventListener('input',()=>{ const id=inp.getAttribute('data-id'), f=inp.getAttribute('data-f'); edits[id]=edits[id]||{}; if(f==='price')edits[id].price=inp.value; else if(f==='unit')edits[id].unit=inp.value; else if(f==='name')edits[id].name=inp.value; else if(f==='cat')edits[id].cat=inp.value; else edits[id].tags=inp.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean); saveEdits(); gen(); }); });
}
async function gen(){
  const ids=document.getElementById('ids').value.trim().split(/\s+/).filter(Boolean);
  const area=document.getElementById('editArea');
  if(!ids.length){ if(area) area.innerHTML=''; return; }
  const key=ids.join(',');
  if(key!==idsKey){ idsKey=key; buildEditors(ids); }
  const items=ids.map(id=>{ const r=DATA[String(id)]||{}; const e=edits[id]||{};
    return {id, name:(e.name!=null?e.name:(r.name||('商品'+id))), price:(e.price!=null?e.price:(r.price||'')), unit:(e.unit!=null?e.unit:(guessUnit(r.name)||r.unit||'件')), tags:(Array.isArray(e.tags)?e.tags:(Array.isArray(r.tags)&&r.tags.length?r.tags:[])), image:r.image||''}; });
  const box=document.getElementById('cardBox'); box.innerHTML=card(items);
  if(WM){ const el=box.firstElementChild; if(el&&!el.querySelector('.wm')){
    const prev=box.hidden; box.hidden=false;
    const w=el.offsetWidth||800, h=el.offsetHeight||1000;
    box.hidden=prev;
    el.insertAdjacentHTML('beforeend', wmHTML(w,h));
  } }
  const pv=document.getElementById('preview'); pv.innerHTML=''; if(box.firstElementChild) pv.appendChild(box.firstElementChild.cloneNode(true));
}
function whiteCard(items){
  const f2=esc(document.getElementById('foot1').value),f3=esc(document.getElementById('foot2').value);
  const ps=mode==='grid'?items.slice(0,4):items.slice(0,1); const sty=mode==='single'?'grid-template-columns:1fr':'';
  const prods=ps.map(p=>'<div class="mprod"><div class="mimg">'+imgHTML(p)+'</div><div class="mpid">'+(mode==='single'?'商品ID: ':'ID: ')+esc(p.id)+'</div><div class="mname">'+esc(p.name)+'</div><div class="mprice">¥<b>'+esc(p.price)+'</b> 元/'+esc(p.unit||'件')+'</div><div class="mtags">'+(p.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('')+'</div></div>').join('');
  return '<div class="mcard '+(mode==='single'?'msingle':'')+'"><img class="mheadimg" src="logo.png" alt="TripMALL"><div class="mtrust"><span>集采低价</span><span>房券换物</span><span>7天无理由退款</span><span>品质保证</span><span>免费开票</span></div><div class="mgrid" style="'+sty+'">'+prods+'</div><div class="mfoot"><div><div class="f1">TRIPMALL 服务市场</div><div class="f2">'+f2+'</div><div class="f3">'+f3+'</div></div><div class="qr"><img src="qr.png" alt="QR"><div class="cap">扫码领券立减</div></div></div></div>';
}

var CAT_KW=['洗发水','沐浴露','护发素','润肤露','润肤霜','洗手液','洗衣液','消毒液','香皂','牙具','牙刷','牙膏','拖鞋','面巾','地巾','浴巾','方巾','毛巾','浴袍','浴衣','枕芯','枕套','被套','床单','被芯','保护垫','毛毯','床垫','床架','茶包','茶叶','咖啡','卷纸','抽纸','湿巾','纸巾','矿泉水','饮用水','纯净水','气泡水','洗沐套装','洗漱套装','护理包','梳子','剃须刀','棉签','浴帽','垃圾桶','衣架','电视','冰箱','空调','洗衣机','烧水壶','电水壶','吹风机','加湿器','咖啡机','灯具','餐具','保温杯','水杯','雨伞','拖鞋'];
function guessCat(pkgName, cats, prodName){
  const segs=String(pkgName||'').split(/[-—–_／/]/).map(s=>s.trim()).filter(Boolean);
  // 1) 先按关键词判定（最稳）
  const src=String(pkgName||'')+' '+String(prodName||'');
  const kw=CAT_KW.find(k=>src.indexOf(k)>=0);
  if(kw) return kw;
  // 2) 再看是否是「规格型」套餐名（带数字/尺寸/括号说明）→ 不用它当品名
  const specLike=s=>/\d/.test(s)||/[【\[（(]/.test(s)||/项目|大货|优惠|颜色|尺码|备注|包邮/.test(s);
  const short=(segs||[]).find(s=>s.length>=2&&s.length<=8&&!specLike(s)&&!/装|款|型号|规格|样品|试样|试用|专拍/.test(s));
  if(short) return short;
  // 3) 组合装：含逗号且不像规格 → 用整段
  const first=segs&&segs[0];
  if(first&&/[,，]/.test(first)&&!specLike(first)) return first.slice(0,24);
  // 4) 兜底：用三级类目的最后一级
  const c=cats||[];
  return c.length?c[c.length-1]:'';
}
function tblRows(items){
  const rows=[];
  items.forEach((it,pi)=>{
    const sp=SPECS[String(it.id)]||null;
    let list=(sp&&Array.isArray(sp.pk))?sp.pk.filter(x=>x&&x.n&&!/样品|试用装|试用|试样|专拍|补差|运费|邮费|一分/.test(x.n)):[];
    if(!list.length) list=[{n:it.name,p:it.price,pic:'',tr:''}];
    const e=edits[it.id]||{};
    const std=(sp&&Array.isArray(sp.p))?sp.p:[];
    list.forEach((pk,vi)=>{
      rows.push({ pi:pi, id:it.id, first:(vi===0), cnt:list.length,
        cat:(e.cat!=null&&e.cat!=='')?e.cat:guessCat(pk.n, sp&&sp.c, it.name),
        img:(pk.pic||it.image), spec:pk.n, std:std,
        price:(pk.p||it.price), unit:(it.unit||'件') });
    });
  });
  rows.forEach((r,i)=>{
    if(i===0||rows[i-1].cat!==r.cat){ let s=1; while(i+s<rows.length&&rows[i+s].cat===r.cat) s++; r.catSpan=s; } else r.catSpan=0;
    r.prodSpan=r.first?r.cnt:0;
  });
  return rows;
}
function stdHTML(props){
  if(!props||!props.length) return '<span style="color:#bbb">（详情页无参数）</span>';
  return props.map((p,i)=>'<i>'+(i+1)+'.'+esc(p[0])+'：'+esc(p[1])+'</i>').join('');
}
function tableCard(items){
  const rows=tblRows(items);
  let body='';
  rows.forEach(r=>{
    body+='<tr>';
    if(r.catSpan>0) body+='<td class="tcat" rowspan="'+r.catSpan+'">'+esc(r.cat)+'</td>';
    if(r.prodSpan>0) body+='<td class="timg" rowspan="'+r.prodSpan+'">'+(r.img?'<img src="'+r.img+'" crossorigin="anonymous" onerror="this.style.visibility=\'hidden\'">':'<span style="color:#bbb">无图</span>')+'</td>';
    body+='<td class="tspec">'+esc(r.spec)+'</td>';
    if(r.prodSpan>0) body+='<td class="tstd" rowspan="'+r.prodSpan+'">'+stdHTML(r.std)+'</td>';
    body+='<td class="tprice">'+esc(r.price)+'元/'+esc(r.unit)+'</td>';
    body+='</tr>';
  });
  return '<div class="tcard"><table class="ttable">'
    +'<colgroup><col style="width:135px"><col style="width:165px"><col style="width:245px"><col style="width:490px"><col style="width:113px"></colgroup>'
    +'<thead><tr><th>品名</th><th>图片</th><th>规格</th><th>产品标准</th><th>价格</th></tr></thead>'
    +'<tbody>'+body+'</tbody></table>'
    +'<div class="ttip">共 '+rows.length+' 行（按套餐/规格自动展开）</div></div>';
}
function card(items){ return tpl==='red' ? redCard(items) : (tpl==='gold' ? goldCard(items) : (tpl==='table' ? tableCard(items) : whiteCard(items))); }
async function exportPng(){
  if(!document.getElementById('cardBox').firstElementChild) await gen();
  const box=document.getElementById('cardBox');
  const el=box.firstElementChild;
  const prev=box.hidden; box.hidden=false; // 显示以获取真实尺寸
  try{
    await new Promise(r=>setTimeout(r,60));
    const c=await html2canvas(el,{scale:2,useCORS:true,allowTaint:false,imageTimeout:30000});
    const blob=await new Promise(res=>c.toBlob(res,'image/png'));
    const a=document.createElement('a');
    if(blob){ a.href=URL.createObjectURL(blob); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }
    else { a.href=c.toDataURL('image/png'); }
    a.download='product-card.png'; a.click();
  } catch(e){ alert('导出失败：'+e.message); }
  finally{ box.hidden=prev; }
}
