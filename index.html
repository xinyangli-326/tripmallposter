<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TripMALL 商品海报生成器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
body{font-family:"Microsoft YaHei",sans-serif;background:#f4f4f4;margin:0}
.wrap{max-width:1320px;margin:20px auto;display:flex;gap:20px;padding:20px}
.left{flex:0 0 400px;background:#fff;border-radius:10px;padding:20px}
.right{flex:1;background:#fff;border-radius:10px;padding:20px;overflow:auto}
h1{font-size:19px;margin:0 0 6px}
.hint{font-size:12px;color:#888;line-height:1.5}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:12px}
textarea{height:200px;font-family:monospace;font-size:11px}
button{background:#e08a00;color:#fff;border:0;padding:9px 16px;border-radius:6px;font-size:14px;cursor:pointer;margin:10px 6px 0 0}
button.gr{background:#5a8}
.mode{display:flex;gap:8px;margin:8px 0}.mode button{background:#eee;color:#333;margin:0}.mode button.on{background:#e08a00;color:#fff}

/* ========== 白底模板 ========== */
.mcard{width:740px;background:#fff;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.mheadimg{width:100%;display:block}
.mtrust{display:flex;justify-content:center;gap:28px;background:#fff7ef;padding:8px 0;font-size:14px;color:#e08a00}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px 28px}
.mprod{border:1px solid #f0f0f0;border-radius:6px;overflow:hidden}
.mimg{height:250px;background:#f6f6f6;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:contain}
.mpid{font-size:12px;color:#999;margin:9px 13px 0}.mname{font-size:18px;font-weight:800;color:#222;margin:3px 13px 7px}
.mprice{font-size:15px;color:#e4393c;margin:0 13px}.mprice b{font-size:25px;font-weight:800}
.mtags{display:flex;flex-wrap:wrap;gap:7px;padding:11px 13px 15px}.mtags span{border:1px solid #f0b46b;color:#c07d00;border-radius:3px;padding:2px 9px;font-size:12px}
.mfoot{background:#fafaf8;padding:14px 28px;display:flex;justify-content:space-between;align-items:flex-start;border-top:1px solid #eee}
.mfoot .f1{font-weight:800;color:#e08a00;font-size:16px}.mfoot .f2{font-size:12px;color:#444;margin:5px 0}.mfoot .f3{font-size:12px;color:#888}
.mfoot .qr{width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mfoot .qr img{width:86px;height:86px;display:block}.mfoot .qr .cap{font-size:10px;color:#aaa;margin-top:2px}
.msingle .mimg{height:440px}.msingle .mpid{font-size:14px}.msingle .mname{font-size:32px}.msingle .mprice b{font-size:42px}.msingle .mtags span{font-size:13px}

/* ========== 红色大促模板 ========== */
.rcard{width:740px;margin:0 auto;box-shadow:0 3px 14px rgba(0,0,0,.28);border-radius:12px;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 50% 0%,#e04a35 0%,#c72d22 32%,#a31812 62%,#7c0c07 100%)}
.rhead{text-align:center;padding:16px 18px 0}
.rlogo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px}
.rlogo .crab{font-size:20px;font-weight:900;color:#fff;background:rgba(255,255,255,.14);border-radius:8px;padding:4px 12px}
.rlogo .mall{font-size:12px;color:#ffe;line-height:1.25;text-align:left}
.rlogo .mall b{font-size:17px;color:#fff;font-weight:900}
.rtitle{display:inline-block;background:linear-gradient(#f8cc55,#e29a20);color:#7a0e08;font-weight:900;font-size:22px;padding:4px 30px;border-radius:6px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.rbig{font-size:54px;font-weight:900;letter-spacing:4px;margin:14px 0 4px;color:#fff;line-height:1;
  text-shadow:0 1px 0 #d23,0 2px 0 #b21,0 3px 0 #900,0 5px 8px rgba(0,0,0,.45),0 0 18px rgba(248,204,85,.55)}
.rsub{display:inline-block;background:#6b0a05;color:#f8cc55;font-weight:700;font-size:18px;padding:5px 30px;border-radius:22px;margin:6px 0;border:1px solid #f8cc55;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.rplat{margin:14px 0 16px;font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.rplat .u{display:inline-block;width:56px;height:3px;background:#fff;margin:0 10px;vertical-align:middle;border-radius:2px}
.rbody{display:flex;gap:14px;padding:0 18px;align-items:stretch}
.rside{flex:0 0 168px;background:linear-gradient(#c1121b,#9c0b12);border-radius:10px;padding:12px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.rside-h{background:#fff;color:#c1121b;font-weight:900;font-size:18px;text-align:center;padding:8px 0;border-radius:8px;margin-bottom:12px}
.rside-list{list-style:none;margin:0 0 12px;padding:0}
.rside-list li{font-size:13px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.3)}
.rside-list li:before{content:"— ";color:#f8cc55;font-weight:800}
.rside-coup{border-top:1px solid rgba(255,255,255,.4);padding-top:10px;text-align:center}
.rside-coup .pre{font-size:13px;color:#ffe;margin-bottom:6px;font-weight:700}
.rside-coup .num{font-size:32px;font-weight:900;color:#f8cc55;line-height:1}
.rside-coup .num small{font-size:16px;margin-right:3px}
.rside-coup .tag{display:inline-block;background:#f8cc55;color:#7a0e08;font-weight:800;font-size:12px;padding:3px 10px;border-radius:12px;margin:6px 0}
.rside-coup .more{font-size:11px;color:#ffe}
.rgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rgrid.one{grid-template-columns:1fr}
.rprod{background:#fff;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.rpimg{height:190px;background:#f7f7f7;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px;overflow:hidden}
.rpimg img{width:100%;height:100%;object-fit:contain}
.rp-id{font-size:11px;color:#aaa;margin:8px 12px 2px}
.rp-name{font-size:15px;font-weight:800;color:#222;margin:0 12px 4px;min-height:40px;line-height:1.35}
.rp-price{color:#d61b1b;font-size:14px;margin:0 12px 6px}
.rp-price b{font-size:26px;font-weight:900}
.rp-tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px}
.rp-tags span{background:#fdeed6;color:#b96a00;border:1px solid #f3cf9a;border-radius:12px;padding:2px 10px;font-size:12px}
.rgrid.one .rpimg{height:280px}
.rfoot{background:linear-gradient(#5b0806,#3d0402);border-radius:12px 12px 0 0;margin-top:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rfoot .txt{font-size:12px;color:#ffe;line-height:1.7}
.rqr{width:92px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rqr img{width:80px;height:80px;display:block;background:#fff;padding:4px;border-radius:6px}
.rqr .cap{font-size:10px;color:#f8cc55;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<div class="left"><h1>TripMALL 商品海报生成器</h1>
<p class="hint" id="hint">每行一个商品ID（空格/换行分隔）。从后台商品库取名称/价格/主图/多标签，按所选模板出图。</p>
<label>海报模板</label>
<div class="mode"><button class="on" id="tb-white" onclick="setTpl('white')">白底模板</button><button id="tb-red" onclick="setTpl('red')">红色大促</button></div>
<label>版式</label>
<div class="mode"><button class="on" id="mb-grid" onclick="setMode('grid')">4商品拼版</button><button id="mb-single" onclick="setMode('single')">单商品竖版</button></div>
<textarea id="ids">6517
69047
67461
67327</textarea>
<label>页脚第二行（优惠话术）</label><input id="foot1" value="新客20元无门槛优惠券 叠加海量店铺优惠券">
<label>页脚第三行（购买路径）</label><input id="foot2" value="电脑端：携程EBooking->商机中心->服务市场；APP端：携程EBooking->用品采购">
<button onclick="gen()">生成</button><button class="gr" onclick="exportPng()">导出 PNG</button>
</div>
<div class="right"><div id="preview"></div></div>
</div>
<div id="cardBox" hidden></div>
<script>
let mode='grid', tpl='white', DATA={};
async function loadData(){ try{ DATA = await fetch('data/products.json').then(r=>r.json()); }catch(e){ DATA={}; } const n=Object.keys(DATA).length; document.getElementById('hint').innerText = '已加载商品 '+n+' 个。每行填一个商品ID。'; }
function setTpl(t){tpl=t;document.getElementById('tb-white').classList.toggle('on',t==='white');document.getElementById('tb-red').classList.toggle('on',t==='red');gen();}
function setMode(m){mode=m;document.getElementById('mb-grid').classList.toggle('on',m==='grid');document.getElementById('mb-single').classList.toggle('on',m==='single');gen();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function imgHTML(p){
  if(!p.image) return '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px">【 商品图 '+esc(p.id)+' 暂无 】</div>';
  return '<img src="'+p.image+'" crossorigin="anonymous" onerror="this.parentNode.textContent=\'【 商品图 '+esc(p.id)+' 加载失败 】\';this.parentNode.style.cssText=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#c9c9c9;font-size:13px\'">';
}
async function gen(){
  const ids=document.getElementById('ids').value.trim().split(/\s+/).filter(Boolean);
  if(!ids.length) return;
  const items=ids.map(id=>{ const r=DATA[String(id)]||{}; return {id, name:r.name||('商品'+id), price:r.price||'', unit:r.unit||'件', tags:(Array.isArray(r.tags)&&r.tags.length?r.tags:[]), image:r.image||''}; });
  const box=document.getElementById('cardBox'); box.innerHTML=card(items);
  const pv=document.getElementById('preview'); pv.innerHTML=''; if(box.firstElementChild) pv.appendChild(box.firstElementChild.cloneNode(true));
}
function whiteCard(items){
  const f2=esc(document.getElementById('foot1').value),f3=esc(document.getElementById('foot2').value);
  const ps=mode==='grid'?items.slice(0,4):items.slice(0,1); const sty=mode==='single'?'grid-template-columns:1fr':'';
  const prods=ps.map(p=>'<div class="mprod"><div class="mimg">'+imgHTML(p)+'</div><div class="mpid">'+(mode==='single'?'商品ID: ':'ID: ')+esc(p.id)+'</div><div class="mname">'+esc(p.name)+'</div><div class="mprice">¥<b>'+esc(p.price)+'</b> 元/'+esc(p.unit||'件')+'</div><div class="mtags">'+(p.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('')+'</div></div>').join('');
  return '<div class="mcard '+(mode==='single'?'msingle':'')+'"><img class="mheadimg" src="logo.png" alt="TripMALL"><div class="mtrust"><span>集采低价</span><span>房券换物</span><span>7天无理由退款</span><span>品质保证</span><span>免费开票</span></div><div class="mgrid" style="'+sty+'">'+prods+'</div><div class="mfoot"><div><div class="f1">TRIPMALL 服务市场</div><div class="f2">'+f2+'</div><div class="f3">'+f3+'</div></div><div class="qr"><img src="qr.png" alt="QR"><div class="cap">扫码领券立减</div></div></div></div>';
}
function redCard(items){
  const f3=esc(document.getElementById('foot2').value);
  const ps=mode==='grid'?items.slice(0,4):items.slice(0,1); const gridCls=mode==='single'?'rgrid one':'rgrid';
  const prods=ps.map(p=>'<div class="rprod"><div class="rpimg">'+imgHTML(p)+'</div><div class="rp-id">ID: '+esc(p.id)+'</div><div class="rp-name">'+esc(p.name)+'</div><div class="rp-price">¥<b>'+esc(p.price)+'</b> 元/'+esc(p.unit||'件')+'</div><div class="rp-tags">'+(p.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('')+'</div></div>').join('');
  return '<div class="rcard"><div class="rhead"><div class="rlogo"><span class="crab">携程</span><span class="mall"><b>TripMALL</b><br>服务市场 · 携程集团</span></div><div class="rtitle">优品推荐</div><div class="rbig">携程服务市场</div><div class="rsub">省时省力省钱 · 采购一站搞定</div><div class="rplat"><span class="u"></span>一站式酒店用品采购平台<span class="u"></span></div></div><div class="rbody"><div class="rside"><div class="rside-h">优惠享不停</div><ul class="rside-list"><li>集采低价</li><li>房券换物</li><li>7天无理由退款</li><li>品质保证</li><li>免费开票</li></ul><div class="rside-coup"><div class="pre">— 先领券 再购物 —</div><div class="num"><small>¥</small>20</div><div class="tag">新客无门槛</div><div class="more">叠加海量店铺优惠券</div></div></div><div class="'+gridCls+'">'+prods+'</div></div><div class="rfoot"><div class="txt">'+f3+'</div><div class="rqr"><img src="qr.png" alt="QR"><div class="cap">扫码领券立减</div></div></div></div>';
}
function card(items){ return tpl==='red' ? redCard(items) : whiteCard(items); }
async function exportPng(){ if(!document.getElementById('cardBox').firstElementChild) await gen(); const el=document.getElementById('cardBox').firstElementChild; const c=await html2canvas(el,{scale:2,useCORS:true,allowTaint:false}); const a=document.createElement('a'); a.href=c.toDataURL(); a.download='product-card.png'; a.click(); }
loadData();
</script>
</body>
</html>
